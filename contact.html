<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Solo Trip to Koreatown | Contact</title>

  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">

  <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>

<body>

  <nav class="navbar md:navbar-expand bg-1">
    <div class="container-fluid">

      <a class="navbar-brand" href="index.html">Koreatown</a>

      <button
        class="btn-icon navbar-toggler"
        type="button"
        data-bs-toggle="drawer"
        data-bs-target="#navbarDrawer"
        aria-controls="navbarDrawer"
        aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
      </button>

      <dialog
        class="drawer drawer-end"
        tabindex="-1"
        id="navbarDrawer"
        aria-labelledby="navbarDrawerLabel">

        <div class="drawer-header">
          <h2 class="drawer-title" id="navbarDrawerLabel">Menu</h2>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="drawer"
            aria-label="Close">
          </button>
        </div>

        <div class="drawer-body mb-2 md:mb-0">
          <ul class="nav navbar-nav me-auto">

            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">Explore</a>
            </li>

            <li class="nav-item">
              <a
                class="nav-link active"
                aria-current="page"
                href="contact.html">
                Contact
              </a>
            </li>

          </ul>
        </div>

      </dialog>
    </div>
  </nav>

  <main class="container mt-5">

    <h1>Contact</h1>
    <p>Have a question about my trip? Leave a message below.</p>

    <form>
      <div class="row g-4">

        <div class="col-12 md:col-6">
          <div class="form-field">
            <label for="firstName" class="form-label">First name</label>

            <input
              type="text"
              class="form-control"
              id="firstName"
              name="firstName">
          </div>
        </div>

        <div class="col-12 md:col-6">
          <div class="form-field">
            <label for="lastName" class="form-label">Last name</label>

            <input
              type="text"
              class="form-control"
              id="lastName"
              name="lastName">
          </div>
        </div>

        <div class="col-12 md:col-6">
          <div class="form-field">
            <label for="email" class="form-label">Email</label>

            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="name@example.com">
          </div>
        </div>

        <div class="col-12 md:col-6">
          <div class="form-field">
            <label for="interest" class="form-label">
              What are you interested in?
            </label>

            <select class="form-control" id="interest" name="interest">
              <option value="food">Food</option>
              <option value="shops">Shops</option>
              <option value="photography">Photography</option>
            </select>
          </div>
        </div>

        <div class="col-12 md:col-6">
          <div class="form-field">
            <label for="message" class="form-label">Message</label>

            <textarea
              class="form-control"
              id="message"
              name="message"
              rows="4"></textarea>
          </div>
        </div>

        <div class="col-12 md:col-6">
          <div class="form-field">
            <input
              type="checkbox"
              class="check"
              id="consent"
              name="consent">

            <label for="consent">
              I agree to share my information.
            </label>
          </div>
        </div>

      </div>

      <button type="submit" class="btn-solid theme-primary mt-4">
        Submit
      </button>

    </form>

  </main>

  <footer class="container mt-5">
    <p class="p-3 bg-1 text-center">
      Solo Trip to Koreatown | Doris
    </p>
  </footer>

</body>
</html>
